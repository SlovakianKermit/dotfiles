lossless=yes
output_dir=/mnt/shared/Cut
multi_cut_mode=merge
ffmpeg_path=ffmpeg
verify=yes
verify_duration=yes
duration_tolerance=2.0
min_size_bytes=1024
ffprobe_path=ffprobe
notify=yes
notify_timeout=1500
notify_error_timeout=15000
delete_source=yes
quit_after_cut=yes
delete_retries=5
delete_retry_delay=0.75
queue_enabled=yes
queue_scope=output_dir
queue_poll_interval=2
queue_stale_timeout=21600
queue_max_wait=0
show_cut_markers=yes
cut_marker_prefix=cut
