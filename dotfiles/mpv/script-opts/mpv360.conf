# mpv360 interactive 360/VR viewer  (github.com/kasper93/mpv360)
# Source files: ~/.config/mpv/scripts/mpv360.lua + ~/.config/mpv/shaders/mpv360.glsl

# Don't auto-enable on every file; toggle per video with Alt+v.
enabled=no

# --- Default view: ctbrec/Stripchat VR180 = side-by-side dual fisheye ---
# input_projection: 0=equirectangular, 1=dual_fisheye, ...
# eye: 0=left, 1=right  (single eye => one flat view on the monitor;
#                        switch to "Both" with Ctrl+Shift+e for SBS)
input_projection=1
eye=0
fisheye_fov=3.1415926535897932

# --- Keybindings ---
# Rebinds below avoid clashes with input.conf, which already owns
# Ctrl+e (video-rotate), Ctrl+r (video-rotate) and Ctrl+LEFT/RIGHT (sub-seek).
toggle=Alt+v
reset-view=Alt+r
look-up=Alt+up
look-down=Alt+down
look-left=Alt+left
look-right=Alt+right
roll-left=Alt+Shift+left
roll-right=Alt+Shift+right
fov-increase=Alt+Shift+down
fov-decrease=Alt+Shift+up

# Free in input.conf -> kept at upstream defaults.
toggle-mouse-look=Ctrl+MBTN_LEFT
show-help=Ctrl+t
cycle-projection=Ctrl+Shift+p
switch-eye=Ctrl+Shift+e
cycle-sampling=Ctrl+Shift+s
