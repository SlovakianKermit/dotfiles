sub-ass-override=yes
# Saturation: SDR default is neutral; HDR gets +20 via [hdr-passthrough] below.
saturation=0
loop-file=inf
volume-max=200
volume=75
autocreate-playlist=same
directory-mode=ignore

# Hardware decoding (RDNA4: H.264/HEVC/VP9/AV1)
hwdec=auto-safe

# Quality
profile=gpu-hq
deband=yes

# Color management (KDE Wayland; AG276QZD2 = 1000-nit peak, 250-nit full-panel)
# SDR-safe default: let KWin treat the surface as plain sRGB. Without this,
# KWin's HDR compositing up-converts SDR sources (SDR -> PQ/BT.2020), which
# tints near-white content (e.g. pale skin looks yellow).
target-colorspace-hint=no
target-prim=bt.709
target-trc=srgb

# Tone-mapping fallback (only used when HDR is not passed through).
hdr-compute-peak=yes
tone-mapping=bt.2446a
# KDE currently reports peak overridden to 930 nits. Uncomment to force the
# tone-mapping target if HDR looks dim or blown out:
#target-peak=930

# Subtitles
sub-auto=fuzzy
sub-file-paths=subs
sub-ass-force-margins=yes

# Resume
save-position-on-quit=yes

# Screenshots
screenshot-format=png

# --- Per-codec hardware decoding ---------------------------------------------
# H.264 hwdec on this box (RX 9070 / Navi 48, Mesa 26.2.5, ffmpeg 9.0.2) stalls
# ~400-500 ms on every seek restart, on every backend (vulkan, vulkan-copy,
# vaapi, vaapi-copy). Software decode seeks in ~200 ms and still plays
# 4096x2048@50 with 0 decoder drops, so H.264 is demoted to software.
# HEVC/VP9/AV1 keep hardware decoding (no seek penalty). Revisit when the
# Mesa H.264 seek bug is fixed; remove this block to restore auto-safe.
[h264-swdec]
profile-cond=get("video-codec") ~= nil and get("video-codec"):find("264") ~= nil
profile-restore=copy
hwdec=no

# --- Automatic HDR passthrough ----------------------------------------------
# Must be the LAST block in this file (options following a [name] header belong
# to that profile). Sources whose transfer function is PQ (HDR10) or HLG switch
# to true HDR passthrough; everything else falls back to the SDR-safe defaults
# above. Untagged/unknown content is treated as SDR, which is what we want.
[hdr-passthrough]
profile-cond=get("video-params/gamma") == "pq" or get("video-params/gamma") == "hlg"
profile-restore=copy
target-colorspace-hint=yes
target-prim=auto
target-trc=auto
saturation=20

