context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "System EQ"
            media.name       = "System EQ"
            filter.graph = {
                nodes = [
                    # Preamp: -6.5 dB to offset the EQ's peak gain (+6.30 dB @ 80 Hz),
                    # so no frequency in the curve can exceed 0 dBFS on full-scale input.
                    # 0.4732 = 10^(-6.5/20). Adjust if the band gains change.
                    {
                        type  = builtin
                        name  = preamp
                        label = linear
                        control = { "Mult" = 0.4732 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_0
                        label = bq_peaking
                        control = { "Freq" = 60.0 "Q" = 0.7 "Gain" = 4.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_peaking
                        control = { "Freq" = 120.0 "Q" = 0.9 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 2000.0 "Q" = 0.8 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 8000.0 "Q" = 1.2 "Gain" = 1.45 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 80.0 "Q" = 1.5 "Gain" = 1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.2 "Gain" = -0.5 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_band_0:In" }
                    { output = "eq_band_0:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "system_eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "system_eq_output"
                node.passive = true
                node.target  = "alsa_output.usb-Focusrite_Scarlett_2i2_USB_Y834X2X1B15239-00.pro-output-0"
            }
        }
    }
]
