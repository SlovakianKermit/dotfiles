## Bluetooth A2DP sink fixes (Pixel 9 -> PC)
##
## PipeWire >= 1.6.4 registers advanced A2DP endpoints (Opus / LC3plus /
## aptX HD ...) with UINT64 metadata that BlueZ's parse_int64_metadata()
## rejects, so the "a2dp-sink" profile is never registered and the device
## only exposes "audio-gateway" (no audio nodes). Restricting the codecs to
## the classic SBC / SBC-XQ / AAC set avoids those broken endpoints.
##
## Roles are limited to the sink + hands-free directions actually needed
## here: the phone is the A2DP source / HFP AG, so the PC must be the
## sink / HF. Dropping a2dp_source also avoids AVDTP role collisions.

monitor.bluez.properties = {
  bluez5.codecs = [ sbc sbc_xq aac ]
  bluez5.roles = [ a2dp_sink hfp_hf hsp_hs ]
}
